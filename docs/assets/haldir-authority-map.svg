<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 940" role="img" aria-labelledby="title desc"><title id="title">Haldir: intelligence proposes, authority stays bounded</title><desc id="desc">Logical architecture. A person uses the workspace and retains owner signing. A trusted backend orchestrates a model, durable state, restricted agent signing and evidence validation. A NEAR mandate checks spending independently. Supplier delivery and payment confirmation are separate. This is not proof of a deployed live journey.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="context-stroke" stroke-width="1.6"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#15251F}.h{font-size:23px;font-weight:700}.s{font-size:19px}.small{font-size:16px}.lane{font-size:19px;font-weight:700;letter-spacing:1px}.edge{fill:none;stroke:#567564;stroke-width:2.4;marker-end:url(#arrow)}.owner{stroke:#805300;stroke-dasharray:7 5}.both{marker-start:url(#arrow)}.muted{fill:#425A4E}.light{fill:#F4F3E9}.note{fill:#805300}</style></defs><rect width="1400" height="940" fill="#F4F3E9"/>
<rect x="350" y="177" width="640" height="715" rx="22" fill="#E3EADF" stroke="#A7B9AA"/>
<text x="40" y="216" class="lane">PERSON + BROWSER</text><text x="385" y="216" class="lane">TRUSTED BACKEND · ONE LOGICAL RUNTIME</text><text x="1040" y="216" class="lane">NEAR EXECUTION</text><path d="M285 326 H385" class="edge both"/><text x="300" y="296" class="small muted">job /</text><text x="300" y="316" class="small muted">readout</text><path d="M500 250 V142" class="edge "/><text x="447" y="166" class="small muted">input</text><path d="M590 142 V250" class="edge "/><text x="607" y="167" class="small muted">proposal, not authority</text><path d="M630 327 H710" class="edge "/><text x="646" y="299" class="small muted">pay</text><path d="M955 327 H1040" class="edge "/><text x="963" y="299" class="small muted">sign</text><path d="M508 440 V560" class="edge both"/><text x="521" y="504" class="small muted">same job / order IDs</text><path d="M1155 470 V508 H832 V560" class="edge "/><text x="896" y="496" class="small muted">causal receipt / outcome</text><path d="M1260 470 V570" class="edge "/><text x="1273" y="523" class="small muted">transfer</text><path d="M1040 649 H955" class="edge "/><text x="964" y="626" class="small muted">data</text><path d="M710 642 H630" class="edge "/><text x="642" y="624" class="small muted">store</text><path d="M285 640 H323 V817 H385" class="edge owner both"/><path d="M955 817 H1010 V191 H1195 V250" class="edge owner"/><text x="1042" y="173" class="small note">Owner-signed create / stop / withdraw</text><g><rect x="435" y="26" width="360" height="116" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="457" y="65" class="h">Model provider</text><text x="457" y="104" class="s">Proposes bounded tool calls</text><text x="457" y="133" class="s">No owner key or payment authority</text></g><text x="840" y="69" class="s muted">External inference boundary</text><text x="840" y="101" class="small muted">Provider adapter ≠ verified live invocation</text><g><rect x="40" y="250" width="245" height="190" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="62" y="289" class="h">Workspace</text><text x="62" y="328" class="s">Prepare the job</text><text x="62" y="357" class="s">Review exact limits</text><text x="62" y="386" class="s">Inspect results</text><text x="62" y="430" class="small">Chat is not authorization</text></g><g><rect x="385" y="250" width="245" height="190" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="407" y="289" class="h">Job orchestrator</text><text x="407" y="328" class="s">Admit approved scope</text><text x="407" y="357" class="s">Validate proposals</text><text x="407" y="386" class="s">Reconcile before retry</text><text x="407" y="430" class="small">No model-selected authority</text></g><g><rect x="710" y="250" width="245" height="190" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="732" y="289" class="h">Restricted signer</text><text x="732" y="328" class="s">Backend-held agent key</text><text x="732" y="357" class="s">Exact mandate + pay</text><text x="732" y="386" class="s">Finite key allowance</text><text x="732" y="430" class="small">Not the owner’s wallet</text></g><g><rect x="1040" y="250" width="310" height="220" rx="14" fill="#173D32" stroke="#173D32"/><text x="1062" y="289" class="h light">Spending mandate</text><text x="1062" y="328" class="s light">Caller + recipient + cap</text><text x="1062" y="357" class="s light">Expiry + owner stop</text><text x="1062" y="386" class="s light">Stable order identity</text><text x="1062" y="415" class="s light">One operation in flight</text></g><g><rect x="385" y="560" width="245" height="142" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="407" y="599" class="h">Durable state</text><text x="407" y="638" class="s">Jobs, orders, attempts</text><text x="407" y="667" class="s">Proofs and artifacts</text><text x="407" y="692" class="small">Adapter-backed repository</text></g><g><rect x="710" y="560" width="245" height="142" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="732" y="599" class="h">Evidence validation</text><text x="732" y="638" class="s">Confirm causal payment</text><text x="732" y="667" class="s">Bind delivered content</text><text x="732" y="692" class="small">Payment ≠ delivery</text></g><g><rect x="1040" y="570" width="310" height="132" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="1062" y="609" class="h">Supplier boundary</text><text x="1062" y="648" class="s">Paid recipient / source data</text><text x="1062" y="692" class="small">Current samples are fictional</text></g><g><rect x="40" y="565" width="245" height="142" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="62" y="604" class="h">Owner wallet</text><text x="62" y="643" class="s">Owner signs explicitly</text><text x="62" y="672" class="s">No key given to model</text><text x="62" y="697" class="small">Live journey not certified</text></g><g><rect x="385" y="760" width="570" height="102" rx="14" fill="#FFFFFF" stroke="#A7B9AA"/><text x="407" y="799" class="h">Owner-operation preparation</text><text x="407" y="838" class="s">Bind and validate create, stop and free-principal withdrawal</text></g><text x="40" y="773" class="s note">Owner authority stays separate.</text><text x="40" y="809" class="small muted">Stopping prevents new spending.</text><text x="40" y="835" class="small muted">It does not undo a settled payment.</text><text x="1040" y="760" class="s muted">Keyless job contract via factory.</text><text x="1040" y="794" class="small muted">Withdraw only after stop / expiry</text><text x="1040" y="821" class="small muted">and no operation in flight.</text><text x="1040" y="856" class="small muted">Gas / storage are not free principal.</text><line x1="40" y1="920" x2="89" y2="920" stroke="#567564" stroke-width="3"/><text x="100" y="926" class="small muted">Runtime and data flow</text><line x1="350" y1="920" x2="399" y2="920" stroke="#805300" stroke-width="3" stroke-dasharray="7 5"/><text x="410" y="926" class="small muted">Separate owner authority</text><text x="820" y="926" class="small muted">Logical topology · Not a public deployment attestation</text></svg>